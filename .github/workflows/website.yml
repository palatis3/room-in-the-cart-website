name: Website checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build the bilingual website
        run: python3 -B src/build.py
      - name: Check routes, translations, metadata and noindex
        run: python3 qa/seo-audit.py
      - name: Verify calculator and edge responses
        run: npm test
      - name: Validate the Cloudflare upload package
        run: python3 hosting/package.py ci
      - name: Install matching Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Check browser navigation and text reflow
        run: npm run test:browser
